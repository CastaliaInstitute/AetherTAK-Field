name: Mobile CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  VITE_AETHER_SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  shared:
    name: Shared app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:run
      - run: npm run lint
      - run: npm run build
      - run: npm run compliance
      - run: npm audit --omit=dev

  android:
    name: Android debug and release builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Create disposable CI release key
        run: >-
          keytool -genkeypair
          -keystore "$RUNNER_TEMP/ci-release.jks"
          -storepass ci-release-only
          -keypass ci-release-only
          -alias ci-release
          -dname "CN=AetherTAK Field CI"
          -keyalg RSA
          -validity 1
          -noprompt
      - name: Test and build debug APK plus CI-signed release AAB
        working-directory: android
        env:
          AETHER_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/ci-release.jks
          AETHER_ANDROID_KEYSTORE_PASSWORD: ci-release-only
          AETHER_ANDROID_KEY_ALIAS: ci-release
          AETHER_ANDROID_KEY_PASSWORD: ci-release-only
        run: ./gradlew test assembleDebug bundleRelease
      - name: Verify Android artifacts and embedded source revision
        run: |
          DEBUG_APK=android/app/build/outputs/apk/debug/app-debug.apk
          RELEASE_AAB=android/app/build/outputs/bundle/release/app-release.aab
          test -s "$DEBUG_APK"
          test -s "$RELEASE_AAB"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$DEBUG_APK" | tee "$RUNNER_TEMP/apksigner.txt"
          grep -Eq 'Verified using v2 scheme.*true' "$RUNNER_TEMP/apksigner.txt"
          unzip -p "$DEBUG_APK" 'assets/public/assets/*.js' \
            > "$RUNNER_TEMP/android-debug-web.js"
          unzip -p "$RELEASE_AAB" 'base/assets/public/assets/*.js' \
            > "$RUNNER_TEMP/android-release-web.js"
          grep -aFq "$VITE_AETHER_SOURCE_REVISION" \
            "$RUNNER_TEMP/android-debug-web.js"
          grep -aFq "$VITE_AETHER_SOURCE_REVISION" \
            "$RUNNER_TEMP/android-release-web.js"
          sha256sum "$DEBUG_APK" "$RELEASE_AAB"
      - uses: actions/upload-artifact@v7
        with:
          name: aethertak-field-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  ios:
    name: iOS debug and release builds
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx cap sync ios
      - name: Test iOS background PLI encoder
        run: |
          swiftc \
            ios/App/App/BackgroundPli.swift \
            ios/App/Tests/BackgroundPli/main.swift \
            -o "$RUNNER_TEMP/background-pli-tests"
          "$RUNNER_TEMP/background-pli-tests"
      - name: Test iOS CoT attribute decoder
        run: |
          swiftc \
            ios/App/App/CotAttribute.swift \
            ios/App/Tests/CotAttribute/main.swift \
            -o "$RUNNER_TEMP/cot-attribute-tests"
          "$RUNNER_TEMP/cot-attribute-tests"
      - name: Test iOS streaming media integrity
        run: |
          swiftc \
            ios/App/App/MediaIntegrity.swift \
            ios/App/Tests/MediaIntegrity/main.swift \
            -o "$RUNNER_TEMP/media-integrity-tests"
          "$RUNNER_TEMP/media-integrity-tests"
      - name: Build iOS Debug for the simulator
        run: >-
          xcodebuild
          -project ios/App/App.xcodeproj
          -scheme App
          -configuration Debug
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build
      - name: Build unsigned iOS Release for the device SDK
        run: >-
          xcodebuild
          -project ios/App/App.xcodeproj
          -scheme App
          -configuration Release
          -sdk iphoneos
          -destination 'generic/platform=iOS'
          -derivedDataPath "$RUNNER_TEMP/aethertak-field-release"
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          build
      - name: Verify iOS Release bundle and embedded source revision
        run: |
          APP_BUNDLE="$RUNNER_TEMP/aethertak-field-release/Build/Products/Release-iphoneos/App.app"
          test -x "$APP_BUNDLE/App"
          test -f "$APP_BUNDLE/PrivacyInfo.xcprivacy"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_BUNDLE/Info.plist")" = \
            "org.castaliainstitute.aethertak.field"
          grep -aR -F -m1 "$VITE_AETHER_SOURCE_REVISION" \
            "$APP_BUNDLE/public/assets"
